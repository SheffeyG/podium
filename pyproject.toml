[project]
name = "podium"
version = "0.1.0"
description = "Expose Bilibili audio streams as podcast RSS feeds"
readme = "README.md"
authors = [
    { name = "SheffeyG", email = "57262511+SheffeyG@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
